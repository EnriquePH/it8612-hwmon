# HP Pavilion 500-526ns (board HP 2B35, AMD A8-6500) with the it8612 driver.
chip "it8612-*"
    label temp1 "CPU"
    label temp2 "Board"
    label temp3 "Tctl"
    # temp3 is AMD's Tctl, relative to the APU limit (70), not real degrees.
    ignore fan1
    label fan2 "Fan 2"
    label fan3 "Fan 3"
